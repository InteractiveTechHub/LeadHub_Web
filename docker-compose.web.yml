services:
  leadshub_web:
    image: jsglobaltech/leadshub_web:latest
    container_name: leadshub_web
    restart: always
    ports:
      - "8080:80"
    networks:
      interactive_net:
        ipv4_address: 172.19.0.10

networks:
  interactive_net:
    name: interactive_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
