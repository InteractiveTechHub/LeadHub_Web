
  <!-- Lead Profile -->
   <ng-container>
    <div class="text-center w-full mt-4">
      <p-avatar label="F" size="xlarge" shape="circle" />
      <div class="font-semibold mt-2">{{ selectedCard.leadName }}</div>
      <div class="text-sm">{{ selectedCard.phoneNumber }}</div>
      <div class="text-sm">{{ selectedCard.email }}</div>
    </div>

    <!-- quick actions -->
    <div class="flex justify-content-center gap-1 mt-6 w-full">
      <p-button icon="pi pi-calendar" variant="outlined" />
      <p-button icon="pi pi-sync"  variant="outlined" />
      <p-button icon="pi pi-flag" variant="outlined" (onClick)="onCloseLeadClicked()" />
      <p-button icon="pi pi-pen-to-square" variant="outlined"  />
    </div>

    @if (showCloseLeadOptions) {
      <form [formGroup]="leadForm" class="mt-4" (submit)="onCloseLead()">
        <div class="border-round w-full p-3" style="border: 1px solid #ccc;">
          @if (selectedCard.status !== 4) {
            <div>
              <p-floatLabel variant="on">
                <p-select name="lead-status" [options]="leadStatusSelect" optionLabel="name" (onChange)="onLeadCloseSelectChanges($event)" />
                <label for="lead-status">Tipo de Venda</label>
              </p-floatLabel>
            </div>

            <div class="mt-2">
              <p-floatLabel variant="on">
                <textarea pTextarea name="lead-note" formControlName="note"></textarea>
                <label for="lead-note">Observação</label>
              </p-floatLabel>
            </div>

            <div class="flex justify-content-end mt-2">
              <p-button label="Cancelar" class="mr-1" severity="danger" (onClick)="onCancel()"/>
              <p-button type="submit" label="Finalizar"/>
            </div>
          }
          @else {
            <div class="text-sm">
              {{ selectedCard.status == 4 ? 'Venda Perdida' : 'Venda Realizada'  }}
            </div>
            <div class="text-sm mt-2">
              Observação: {{ selectedCard.saleNote }}
            </div>
          }

        </div>
      </form>
    }

    <!-- Product -->
     <div>
    </div>
   </ng-container>
