<p-card [style]="{ height: '100%'}">

  <!-- TODO: Later it can become a component because we goint to have others integrations -->
  <p-toolbar>
    <ng-template pTemplate="left">
      <p-button
        icon="pi pi-plus"
        [raised]="true"
        label="Novo Whatsapp"
        [style]="{ marginRight: '0.4rem' }"
        severity="secondary"
      />

      <p-button
        [disabled]="!activeEditButton"
        icon="pi pi-pencil"
        [raised]="true"
        label="Editar Whatsapp"
        severity="primary"
        (onClick)="editWhatsApp()"
      />
    </ng-template>
  </p-toolbar>

  <p-table
    [value]="whatsAppConfigList"
    [lazy]="true"
    (onLazyLoad)="loadChannels($event)"
    (onRowSelect)="showEditButton()"
    (onRowUnselect)="showEditButton()"
    [(selection)]="selectedWhatsApp"
    styleClass="p-datatable-gridlines p-datatable-striped"
    [tableStyle]="{ 'min-width': '50rem', 'margin-top': '1rem' }"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    [virtualScrollItemSize]="46"
    [scrollable]="true"
    scrollHeight="100%"
    [resizableColumns]="true"
    [rowHover]="true"
    columnResizeMode="expand"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 4rem"></th>
        <th>
          Business Account Id
          <p-columnFilter type="text" field="Name" display="menu" />
        </th>
        <th>
          Phone Number Id
          <p-columnFilter type="text" field="type" display="menu" />
        </th>
        <th>
          Ativo
          <p-columnFilter type="boolean" field="Enabled" display="menu" />
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-config>
      <tr>
        <td>
          <p-tableRadioButton [value]="config" />
        </td>
        <td>{{ config.businessAccountId }}</td>
        <td>{{ config.phoneNumberId }}</td>
        <td>{{ config.enabled ? "Ativo" : "Inativo" }}</td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7">Sem registros para mostrar.</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
