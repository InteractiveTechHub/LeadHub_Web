name: Deploy to VPS using Docker Compose

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            jsglobaltech/leadhub_web:latest
            jsglobaltech/leadhub_web:${{ github.sha }}
          build-args: |
            BUILD_CONFIGURATION=production

  transfer:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: copy files to server (Docker Compose)
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          #key: ${{ secrets.VPS_SSH_KEY }}
          source: "${{ github.workspace }}/docker-compose.web.yml"
          target: "/opt/leadshub"

  deploy:
    runs-on: ubuntu-latest
    needs: transfer

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          #key: ${{ secrets.VPS_SSH_KEY }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /opt/leadshub/github/workspace
            sudo docker-compose -f docker-compose.web.yml config
            sudo docker-compose -f docker-compose.web.yml pull
            sudo docker-compose -f docker-compose.web.yml up -d --no-deps --build --remove-orphans
            sudo docker image prune -f
