services:
  traefik:
    image: "traefik:v2.10"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080" # Painel do Traefik
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`www.tecnoprohub.com`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    depends_on:
      - traefik

